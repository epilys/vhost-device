[package]
name = "vhost-device-media"
version = "0.1.0"
authors = ["Manos Pitsidianakis <manos.pitsidianakis@linaro.org>"]
description = "virtio-media vhost backend device"
repository = "https://github.com/rust-vmm/vhost-device"
readme = "README.md"
keywords = ["vhost", "virtio-media", "v4l2", "virtio"]
categories = ["multimedia", "virtualization"]
license = "Apache-2.0 OR BSD-3-Clause"
edition = "2021"
publish = false

[features]
xen = ["vm-memory/xen", "vhost/xen", "vhost-user-backend/xen"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
thiserror = "2.0"
vhost = { version = "0.14", features = ["vhost-user-backend"] }
vhost-user-backend = "0.20"
virtio-bindings = "0.2.5"
virtio-queue = "0.16"
vm-memory = "0.16.1"
vmm-sys-util = "0.14"
nix = { version = "0.30", features = ["ioctl", "fs"] }

[dev-dependencies]
assert_matches = "1.5"
virtio-queue = { version = "0.16", features = ["test-utils"] }
vm-memory = { version = "0.16.1", features = ["backend-mmap", "backend-atomic"] }

[lints]
workspace = true
